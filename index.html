    <style>
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#000;transition:opacity .4s,visibility .4s}

        background:linear-gradient(100deg,#2a2a2a 40%,#8a8a8a 50%,#2a2a2a 60%) 0 0/300% 100%;animation:boot 1.4s linear infinite}
      [data-theme=light] #boot i{background-image:linear-gradient(100deg,#d8d8d8 40%,#f7f7f7 50%,#d8d8d8 60%)}
      @keyframes boot{from{background-position:100% 0}to{background-position:0 0}}
      @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
    </style>
  </head>
